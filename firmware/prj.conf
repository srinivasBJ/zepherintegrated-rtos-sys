# =============================================================================
# Vehicle Emergency Response System — Zephyr Kconfig
# =============================================================================

# ── Kernel ────────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── Multithreading ────────────────────────────────────────────────────────────
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_PRINTK=y

# ── Shell (debug CLI over UART) ───────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y

# ── I2C (accelerometer + heart-rate sensor) ───────────────────────────────────
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# ── UART (GPS + GSM modem) ───────────────────────────────────────────────────
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# ── GPIO (interrupt pin from ADXL345) ────────────────────────────────────────
CONFIG_GPIO=y

# ── Sensor subsystem ─────────────────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# ── Networking (native_posix simulation) ─────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_LOG=y

# ── HTTP Client ──────────────────────────────────────────────────────────────
CONFIG_HTTP_CLIENT=y
CONFIG_NET_HTTP=y

# ── JSON ─────────────────────────────────────────────────────────────────────
CONFIG_JSON_LIBRARY=y

# ── Zbus (message bus for inter-thread events) ────────────────────────────────
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y

# ── Assertions & debugging ────────────────────────────────────────────────────
CONFIG_ASSERT=y
CONFIG_DEBUG=y
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=n
